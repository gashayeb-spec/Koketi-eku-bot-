<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOKETI KURT & LOUNGE - Digital Equb</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --gold: #f59e0b;
            --gold-light: #fbbf24;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 40px; }
        .container { max-width: 500px; margin: 0 auto; }

        .header-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--gold); border-radius: 16px; padding: 20px; text-align: center;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.15); margin-bottom: 20px;
        }
        .header-card h1 { color: var(--gold); font-size: 1.4rem; font-weight: bold; margin-bottom: 5px; }
        .header-card p { color: var(--text-muted); font-size: 0.85rem; }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 12px; background: var(--card); border: 1px solid var(--border);
            color: var(--text-muted); border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active { background: var(--gold); color: #0f172a; border-color: var(--gold); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-card, .info-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 15px;
        }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); outline: none; font-size: 0.95rem;
        }
        .input-group input:focus { border-color: var(--gold); }

        .btn {
            width: 100%; padding: 14px; background: var(--gold); color: #0f172a; border: none;
            border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: var(--gold-light); }

        .member-book {
            border: 1px dashed var(--gold); border-radius: 12px; padding: 15px; margin-bottom: 15px; background: rgba(245, 158, 11, 0.03);
        }
        .book-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .book-row .label { color: var(--text-muted); }
        .book-row .value { font-weight: bold; }

        .file-upload {
            border: 2px dashed var(--border); border-radius: 8px; padding: 15px; text-align: center; cursor: pointer;
        }
        .file-upload input { display: none; }

        .alert { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; }
        .alert-info { background: rgba(245, 158, 11, 0.1); border: 1px solid var(--gold); color: var(--gold); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <i class="fas fa-crown" style="font-size: 2.5rem; color: var(--gold); margin-bottom: 8px;"></i>
            <h1>KOKETI KURT & LOUNGE</h1>
            <p>ዲጂታል የዕቁብ መዝገብና የደብተር አገልግሎት</p>
        </div>

        <!-- ➕ የደንበኞች ድጋፍ ስልክ ቁጥር ማሳያ ሳጥን -->
        <div id="supportPhoneBox" class="alert alert-info" style="display: none; text-align: center; font-weight: bold; margin-bottom: 15px;">
            <i class="fas fa-headset"></i> የደንበኞች ድጋፍ ስልክ፦ <span id="displaySupportPhone" style="color: var(--gold);"></span>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('dashboardTab')"><i class="fas fa-book-open"></i> የኔ ደብተር</button>
            <button class="tab-btn" onclick="switchTab('registerTab')"><i class="fas fa-user-plus"></i> አዲስ ምዝገባ</button>
        </div>

        <!-- Dashboard Tab -->
        <div id="dashboardTab" class="tab-content active">
            <div id="drawInfoCard" class="info-card" style="border-color: var(--gold);">
                <h3 style="color: var(--gold); font-size: 1rem; margin-bottom: 10px;"><i class="fas fa-trophy"></i> የሳምንቱ የዕጣ መረጃ</h3>
                <div class="book-row"><span class="label">የወጣው ዕጣ ቁጥር፦</span><span class="value" id="latestDrawNum">-</span></div>
                <div class="book-row"><span class="label">የዕጣው ባለቤት፦</span><span class="value" id="latestWinner">-</span></div>
                <div class="book-row"><span class="label">ቀን፦</span><span class="value" id="latestDrawDate">-</span></div>
            </div>

            <div id="myMembersContainer">
                <!-- User's Registered Equbs -->
            </div>

            <!-- Weekly Receipt Upload Card -->
            <div id="weeklyUploadCard" class="form-card" style="display: none;">
                <h3 style="color: var(--gold); font-size: 1rem; margin-bottom: 10px;"><i class="fas fa-receipt"></i> የሳምንታዊ ክፍያ ስክሪንሹት መላኪያ</h3>
                <form id="weeklyReceiptForm">
                    <div class="input-group">
                        <label>የሚከፍሉበት አካውንት ይምረጡ</label>
                        <select id="weeklyMemberSelect" required></select>
                    </div>
                    <div class="input-group">
                        <label>የክፍያ ደረሰኝ/ስክሪንሹት</label>
                        <div class="file-upload" onclick="document.getElementById('weeklyFile').click()">
                            <i class="fas fa-cloud-upload-alt" style="font-size: 1.5rem; color: var(--gold);"></i>
                            <p id="weeklyFileName" style="font-size: 0.8rem; margin-top: 5px;">ፋይል ለመምረጥ እዚህ ይጫኑ</p>
                            <input type="file" id="weeklyFile" accept="image/*" required onchange="updateFileName(this, 'weeklyFileName')">
                        </div>
                    </div>
                    <button type="submit" class="btn">ስክሪንሹቱን ለአድሚኑ ላክ</button>
                </form>
            </div>
        </div>

        <!-- Registration Tab -->
        <div id="registerTab" class="tab-content">
            <div id="regStatusAlert" class="alert alert-info" style="display: none;"></div>

            <div class="form-card">
                <form id="registrationForm">
                    <input type="hidden" id="telegramIdInput">
                    <input type="hidden" id="refNoInput">

                    <div class="input-group">
                        <label>ስም (First Name)</label>
                        <input type="text" id="firstName" required>
                    </div>
                    <div class="input-group">
                        <label>የአባት ስም (Father's Name)</label>
                        <input type="text" id="fatherName" required>
                    </div>
                    <div class="input-group">
                        <label>የአያት ስም (Grandfather's Name)</label>
                        <input type="text" id="grandName" required>
                    </div>
                    <div class="input-group">
                        <label>ስልክ ቁጥር</label>
                        <input type="tel" id="phoneNumber" placeholder="09..." required>
                    </div>
                    <div class="input-group">
                        <label>ክልል / ከተማ</label>
                        <input type="text" id="regionSelect" placeholder="ምሳሌ፦ ሀዋሳ" required>
                    </div>
                    <div class="input-group">
                        <label>የዕጣ ብዛት (Share Count)</label>
                        <input type="number" id="shareCount" value="1" min="1" required onchange="calculateTotal()">
                    </div>
                    <div class="input-group">
                        <label>የአንዱ ዕጣ ሳምንታዊ ክፍያ</label>
                        <select id="cycleAmount" onchange="calculateTotal()">
                            <option value="5000">5,000 ብር</option>
                            <option value="10000">10,000 ብር</option>
                            <option value="20000">20,000 ብር</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>ጠቅላላ የሳምንት ክፍያዎት፦ <b id="totalCalc" style="color: var(--gold);">5,000 ብር</b></label>
                    </div>
                    <div class="input-group">
                        <label>የክፍያ መንገድ</label>
                        <select id="paymentMethod">
                            <option value="CBE">የኢትዮጵያ ንግድ ባንክ (CBE)</option>
                            <option value="Telebirr">ቴሌብር (Telebirr)</option>
                            <option value="BOA">አቢሲንያ ባንክ (BOA)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>የመጀመሪያ ክፍያ ደረሰኝ (ስክሪንሹት)</label>
                        <div class="file-upload" onclick="document.getElementById('regReceipt').click()">
                            <i class="fas fa-file-invoice" style="font-size: 1.5rem; color: var(--gold);"></i>
                            <p id="regFileName" style="font-size: 0.8rem; margin-top: 5px;">የክፍያ ደረሰኝ ያያይዙ</p>
                            <input type="file" id="regReceipt" accept="image/*" required onchange="updateFileName(this, 'regFileName')">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>የጋበዘዎት ሰው መለያ (Optional Referral)</label>
                        <input type="text" id="referredBy" placeholder="የሪፈራል ኮድ">
                    </div>

                    <button type="submit" class="btn" id="regBtn">የምዝገባ ጥያቄ ላክ</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if(tg) tg.expand();

        const telegramId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id.toString() : "";
        document.getElementById('telegramIdInput').value = telegramId;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function generateRefNo() {
            return 'KQT-' + Math.floor(100000 + Math.random() * 900000);
        }

        function calculateTotal() {
            const count = parseInt(document.getElementById('shareCount').value) || 1;
            const amount = parseFloat(document.getElementById('cycleAmount').value) || 5000;
            document.getElementById('totalCalc').innerText = (count * amount).toLocaleString() + " ብር";
        }

        function updateFileName(input, targetId) {
            if(input.files && input.files[0]) {
                document.getElementById(targetId).innerText = input.files[0].name;
            }
        }

        async function loadUserData() {
            if(!telegramId) return;
            try {
                const res = await fetch(`/api/member_info/${telegramId}`);
                const data = await res.json();

                // Set Draw Info & Admin Dynamic Settings
                if(data.settings) {
                    document.getElementById('latestDrawNum').innerText = data.settings.latest_draw_number || 'አልወጣም';
                    document.getElementById('latestWinner').innerText = data.settings.winner_name || '-';
                    document.getElementById('latestDrawDate').innerText = data.settings.latest_draw_date || '-';

                    // 1. የድጋፍ ስልክ ቁጥር ማሳያ
                    if(data.settings.support_phone) {
                        document.getElementById('displaySupportPhone').innerText = data.settings.support_phone;
                        document.getElementById('supportPhoneBox').style.display = 'block';
                    }

                    // 2. የምዝገባ ሁኔታ እና የገደብ (Max Members) ቼክ
                    const totalReg = data.stats ? data.stats.total_registered : (data.members ? data.members.length : 0);
                    const maxLimit = parseInt(data.settings.max_members) || 0;

                    if(data.settings.registration_status === 'CLOSED' || (maxLimit > 0 && totalReg >= maxLimit)) {
                        const regBtn = document.getElementById('regBtn');
                        const alertBox = document.getElementById('regStatusAlert');
                        
                        regBtn.disabled = true;
                        regBtn.innerText = "ምዝገባ ለጊዜው ተዘግቷል";

                        alertBox.style.display = 'block';
                        alertBox.innerText = data.settings.registration_status === 'CLOSED' 
                            ? "⚠️ የምዝገባ ጊዜ ተጠናቋል/ተዘግቷል።" 
                            : "⚠️ የተፈቀደው የአባላት ብዛት ገደብ ስለሞላ ምዝገባ ተዘግቷል።";
                    }
                }

                // Populate User Accounts
                const container = document.getElementById('myMembersContainer');
                const select = document.getElementById('weeklyMemberSelect');
                container.innerHTML = '';
                select.innerHTML = '';

                if(data.members && data.members.length > 0) {
                    document.getElementById('weeklyUploadCard').style.display = 'block';

                    data.members.forEach(m => {
                        const option = document.createElement('option');
                        option.value = m.id;
                        option.innerText = `${m.first_name} (${m.ref_no})`;
                        select.appendChild(option);

                        const card = document.createElement('div');
                        card.className = 'member-book';
                        card.innerHTML = `
                            <div class="book-row"><span class="label">የመዝገብ ቁጥር (Ref):</span><span class="value" style="color:var(--gold);">${m.ref_no}</span></div>
                            <div class="book-row"><span class="label">ስም:</span><span class="value">${m.first_name} ${m.father_name}</span></div>
                            <div class="book-row"><span class="label">የምዝገባ ሁኔታ:</span><span class="value" style="color:${m.status === 'Approved' ? 'var(--success)' : 'var(--gold)'};">${m.status}</span></div>
                            <div class="book-row"><span class="label">የዚህ ሳምንት ክፍያ:</span><span class="value">${m.weekly_paid_status === 1 ? '✅ ተከፍሏል' : '❌ አልተከፈለም'}</span></div>
                            <div class="book-row"><span class="label">ጠቅላላ የተከፈለ:</span><span class="value">${m.paid_amount.toLocaleString()} ብር</span></div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<div class="alert alert-info">እስካሁን የተመዘገበ አካውንት የለዎትም። በአዲስ ምዝገባ ገጽ መመዝገብ ይችላሉ።</div>`;
                }

            } catch(e) { console.error(e); }
        }

        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.innerText = "እየተላከ ነው...";

            const formData = new FormData();
            formData.append('ref_no', generateRefNo());
            formData.append('telegram_id', telegramId);
            formData.append('first_name', document.getElementById('firstName').value);
            formData.append('father_name', document.getElementById('fatherName').value);
            formData.append('grand_name', document.getElementById('grandName').value);
            formData.append('phone_number', document.getElementById('phoneNumber').value);
            formData.append('region_select', document.getElementById('regionSelect').value);
            formData.append('share_count', document.getElementById('shareCount').value);
            formData.append('cycle_amount', document.getElementById('cycleAmount').value);
            formData.append('payment_method', document.getElementById('paymentMethod').value);
            formData.append('referred_by', document.getElementById('referredBy').value || '-');
            formData.append('receipt', document.getElementById('regReceipt').files[0]);

            try {
                const res = await fetch('/api/register', { method: 'POST', body: formData });
                const data = await res.json();
                if(res.ok) {
                    alert("የምዝገባ ጥያቄዎ በተሳካ ሁኔታ ለአድሚኑ ተልኳል!");
                    location.reload();
                } else {
                    alert(data.message || "ምዝገባው አልተሳካም");
                    btn.disabled = false;
                    btn.innerText = "የምዝገባ ጥያቄ ላክ";
                }
            } catch(err) {
                alert("የሰርቨር ችግር አጋጥሟል!");
                btn.disabled = false;
                btn.innerText = "የምዝገባ ጥያቄ ላክ";
            }
        });

        document.getElementById('weeklyReceiptForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('member_id', document.getElementById('weeklyMemberSelect').value);
            formData.append('receipt', document.getElementById('weeklyFile').files[0]);

            try {
                const res = await fetch('/api/upload_weekly_receipt', { method: 'POST', body: formData });
                const data = await res.json();
                if(res.ok) {
                    alert("የሳምንቱ ክፍያ ስክሪንሹት ለአድሚኑ ተልኳል!");
                    location.reload();
                } else {
                    alert(data.message);
                }
            } catch(err) { alert("መላክ አልተቻለም!"); }
        });

        loadUserData();
    </script>
</body>
</html>
