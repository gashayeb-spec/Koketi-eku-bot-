<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOKETI - የአድሚን መቆጣጠሪያ</title>
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 15px; margin: 0; }
    h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
    .card { background-color: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
    .card h3 { margin-top: 0; color: #f1f5f9; border-bottom: 1px solid #334155; padding-bottom: 8px; font-size: 16px; }
    .btn { background-color: #22c55e; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 8px; }
    .btn-broadcast { background-color: #e11d48; margin-top: 10px; }
    .btn-approve { background-color: #3b82f6; padding: 5px 10px; width: auto; font-size: 12px; }
    input, select { padding: 9px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
    th, td { border: 1px solid #334155; padding: 8px; text-align: left; }
    th { background-color: #0f172a; color: #94a3b8; }
    .badge-pending { background-color: #f59e0b; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .badge-approved { background-color: #22c55e; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .guarantor-info { color: #cbd5e1; font-size: 10px; line-height: 1.3; }
</style>
</head>
<body>

<h2>⚙️ KOKETI የአድሚን ዳሽቦርድ</h2>

<!-- 1. የሳምንት እና ዕጣ መቆጣጠሪያ -->
<div class="card">
    <h3>🎲 የዕጣ እና ማስታወቂያ መቆጣጠሪያ (Draw Control)</h3>
    <div class="grid">
        <div>
            <label>ስንተኛው ሳምንት</label>
            <input type="number" id="current_week" placeholder="ምሳሌ፦ 1">
        </div>
        <div>
            <label>የወጣው ዕጣ ቁጥር</label>
            <input type="text" id="draw_number" placeholder="ምሳሌ፦ KOK-4821">
        </div>
    </div>
    <div class="grid">
        <div>
            <label>የዕጣው ባለቤት (አሸናፊ)</label>
            <input type="text" id="winner_name" placeholder="የባለዕጣው ስም">
        </div>
        <div>
            <label>ዕጣ የወጣበት ቀን</label>
            <input type="text" id="draw_date" placeholder="ምሳሌ፦ ነሐሴ 10">
        </div>
    </div>
    <button class="btn" onclick="saveDraw(false)">💾 መረጃውን ብቻ መዝግብ</button>
    <button class="btn btn-broadcast" onclick="saveDraw(true)">📢 መዝግብና ለአባላት በሙሉ አብስር (Broadcast)</button>
</div>

<!-- 2. የአባላት ሙሉ ዝርዝርና የዋስትና መረጃ -->
<div class="card">
    <h3>👥 የአባላት ሙሉ መረጃና ዋስትና (ለአድሚን ብቻ)</h3>
    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>Ref No</th>
                    <th>ስም & ስልክ</th>
                    <th>ዕጣ</th>
                    <th>ዙር (ብር)</th>
                    <th>የዋስትና መረጃ (ቼክ/ዋስ/ንብረት)</th>
                    <th>ሁኔታ</th>
                    <th>እርምጃ</th>
                </tr>
            </thead>
            <tbody id="membersTable">
                <tr><td colspan="7">መረጃ በመጫን ላይ...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
async function loadData() {
    const res = await fetch('/api/admin/members');
    const data = await res.json();
    
    document.getElementById('draw_number').value = data.settings.latest_draw_number || '';
    document.getElementById('draw_date').value = data.settings.latest_draw_date || '';
    document.getElementById('current_week').value = data.settings.current_week || 1;
    document.getElementById('winner_name').value = data.settings.winner_name || '';

    const tbody = document.getElementById('membersTable');
    tbody.innerHTML = '';

    data.members.forEach(m => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><b>${m.ref_no}</b></td>
            <td>${m.first_name} ${m.father_name}<br><small>${m.phone_number}</small></td>
            <td><b>${m.share_count || 1}</b> ዕጣ</td>
            <td>${m.cycle_amount}</td>
            <td class="guarantor-info">
                <b>ቼክ:</b> ${m.member_cheque || '-'}<br>
                <b>ዋስ:</b> ${m.guarantor_name || '-'}<br>
                <b>የዋስ ቼክ:</b> ${m.guarantor_cheque || '-'}<br>
                <b>ንብረት:</b> ${m.collateral_item || '-'}
            </td>
            <td><span class="${m.status === 'Pending' ? 'badge-pending' : 'badge-approved'}">${m.status}</span></td>
            <td>
                ${m.status === 'Pending' ? `<button class="btn btn-approve" onclick="approveMember(${m.id})">Approve</button>` : '✓ የጸደቀ'}
            </td>
        `;
        tbody.appendChild(row);
    });
}

async function approveMember(id) {
    if(confirm('ይህንን አባል ማረጋገጥ ይፈልጋሉ?')) {
        await fetch('/api/admin/approve/' + id, { method: 'POST' });
        loadData();
    }
}

async function saveDraw(shouldBroadcast) {
    const num = document.getElementById('draw_number').value;
    const date = document.getElementById('draw_date').value;
    const week = document.getElementById('current_week').value;
    const winner = document.getElementById('winner_name').value;

    if (shouldBroadcast && !confirm('የወጣውን ዕጣ መረጃ ለሁሉም አባላት በቴሌግራም መላክ ይፈልጋሉ?')) {
        return;
    }

    const res = await fetch('/api/admin/update_draw', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            draw_number: num, 
            draw_date: date, 
            current_week: week, 
            winner_name: winner,
            broadcast: shouldBroadcast 
        })
    });

    if (res.ok) {
        alert(shouldBroadcast ? 'ማስታወቂያው ለሁሉም አባላት ተበትኗል!' : 'መረጃው በስኬት ተመዝግቧል!');
        loadData();
    }
}

loadData();
</script>

</body>
</html>
