<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOKETI KURT & LOUNGE - የዕቁብ መመዝገቢያ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 15px; margin: 0; }
    .card { background-color: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; max-width: 500px; margin: 0 auto; }
    h2 { color: #38bdf8; text-align: center; margin-top: 0; font-size: 20px; }
    p.sub { color: #94a3b8; text-align: center; font-size: 13px; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; font-weight: 500; }
    input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: #ffffff; box-sizing: border-box; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-gps { background-color: #0284c7; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 4px; width: 100%; }
    .btn-submit { background-color: #22c55e; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 15px; }
    .section-title { color: #f59e0b; font-size: 14px; border-bottom: 1px solid #334155; padding-bottom: 4px; margin-top: 20px; margin-bottom: 12px; font-weight: bold; }
</style>
</head>
<body>

<div class="card">
    <h2>🍷 KOKETI KURT & LOUNGE</h2>
    <p class="sub">የዲጂታል ዕቁብ አባልነት መመዝገቢያ ፎርም</p>

    <form id="equbForm">
        <div class="form-group">
            <label>የመዝገብ/አባል ቁጥር (Ref No)*</label>
            <input type="text" id="ref_no" readonly style="background-color: #334155; font-weight: bold; color: #38bdf8;">
        </div>

        <div class="section-title">👤 የግል መረጃ</div>
        
        <div class="form-group">
            <label>ስም (First Name)*</label>
            <input type="text" id="first_name" required placeholder="የእርስዎን ስም ያስገቡ">
        </div>

        <div class="grid">
            <div class="form-group">
                <label>የአባት ስም*</label>
                <input type="text" id="father_name" required placeholder="የአባት ስም">
            </div>
            <div class="form-group">
                <label>የአያት ስም*</label>
                <input type="text" id="grand_name" required placeholder="የአያት ስም">
            </div>
        </div>

        <div class="form-group">
            <label>የስልክ ቁጥር*</label>
            <input type="tel" id="phone_number" required placeholder="09........">
        </div>

        <div class="section-title">📍 የአድራሻ መረጃ</div>

        <div class="form-group">
            <label>ክልል / ከተማ*</label>
            <select id="region_select" required>
                <option value="">-- ይምረጡ --</option>
                <option value="ሲዳማ (ሀዋሳ)">ሲዳማ (ሀዋሳ)</option>
                <option value="አዲስ አበባ">አዲስ አበባ</option>
                <option value="ኦሮሚያ">ኦሮሚያ</option>
                <option value="አማራ">አማራ</option>
                <option value="ደቡብ ኢትዮጵያ">ደቡብ ኢትዮጵያ</option>
                <option value="ሌላ">ሌላ</option>
            </select>
        </div>

        <div class="form-group">
            <label>ትክክለኛ የመኖሪያ ቦታ (GPS Location)</label>
            <input type="text" id="gps_location" placeholder="GPS አድራሻ እዚህ ይታያል" readonly>
            <button type="button" class="btn-gps" onclick="getLocation()">📍 አሁን ያሉበትን ቦታ በ GPS ያግኙ</button>
        </div>

        <div class="section-title">💰 የዕቁብ መረጃ</div>

        <div class="grid">
            <div class="form-group">
                <label>የዕጣ ብዛት*</label>
                <select id="share_count" required>
                    <option value="1">1 ዕጣ</option>
                    <option value="2">2 ዕጣ</option>
                    <option value="3">3 ዕጣ</option>
                    <option value="4">4 ዕጣ</option>
                    <option value="5">5 ዕጣ</option>
                </select>
            </div>
            <div class="form-group">
                <label>የአንድ ዕጣ ዙር (ብር)*</label>
                <input type="number" id="cycle_amount" value="5000" required>
            </div>
        </div>

        <div class="form-group">
            <label>የክፍያ አማራጭ*</label>
            <select id="payment_method" required>
                <option value="ንግድ ባንክ (CBE)">የኢትዮጵያ ንግድ ባንክ (CBE)</option>
                <option value="ቴሌብር (telebirr)">ቴሌብር (telebirr)</option>
                <option value="አዋሽ ባንክ (Awash)">አዋሽ ባንክ</option>
                <option value="አቢሲኒያ ባንክ (Abyssinia)">አቢሲኒያ ባንክ</option>
                <option value="በእጅ/በጥሬ ገንዘብ">በእጅ (በጥሬ ገንዘብ)</option>
            </select>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">🚀 ምዝገባውን አጠናቅቅ</button>
    </form>
</div>

<script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    function generateRefNo() {
        const rand = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('ref_no').value = 'KOK-' + rand;
    }
    generateRefNo();

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    document.getElementById('gps_location').value = `${position.coords.latitude.toFixed(5)}, ${position.coords.longitude.toFixed(5)}`;
                    alert('📍 GPS አድራሻዎ ተወስዷል!');
                },
                (error) => alert('GPS መውሰድ አልተቻለም።')
            );
        }
    }

    document.getElementById('equbForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'በመላክ ላይ...';

        const telegram_id = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : '';

        const formData = {
            ref_no: document.getElementById('ref_no').value,
            telegram_id: telegram_id,
            first_name: document.getElementById('first_name').value,
            father_name: document.getElementById('father_name').value,
            grand_name: document.getElementById('grand_name').value,
            phone_number: document.getElementById('phone_number').value,
            region_select: document.getElementById('region_select').value,
            gps_location: document.getElementById('gps_location').value,
            share_count: parseInt(document.getElementById('share_count').value),
            cycle_amount: parseFloat(document.getElementById('cycle_amount').value),
            payment_method: document.getElementById('payment_method').value
        };

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            if (response.ok) {
                alert('🎉 ምዝገባዎ ተጠናቋል! አድሚኑ ሲያጸድቀው የዕቁብ ደብተርዎ ይከፈታል።');
                if (tg) tg.close();
            } else {
                alert('ምዝገባው አልተሳካም።');
                submitBtn.disabled = false;
                submitBtn.innerText = '🚀 ምዝገባውን አጠናቅቅ';
            }
        } catch (error) {
            alert('የኔትወርክ ስህተት አጋጥሟል።');
            submitBtn.disabled = false;
            submitBtn.innerText = '🚀 ምዝገባውን አጠናቅቅ';
        }
    });
</script>

</body>
</html>
