<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOKETI - የአድሚን መቆጣጠሪያ</title>
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 15px; margin: 0; }
    h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
    .card { background-color: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
    .card h3 { margin-top: 0; color: #f1f5f9; border-bottom: 1px solid #334155; padding-bottom: 8px; font-size: 16px; }
    .btn { background-color: #22c55e; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 8px; }
    .btn-broadcast { background-color: #e11d48; margin-top: 10px; }
    .btn-unpaid { background-color: #f59e0b; color: #000; margin-top: 10px; }
    .btn-toggle-reg { background-color: #0284c7; margin-top: 10px; }
    
    .btn-action { padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; color: white; cursor: pointer; margin-right: 2px; margin-bottom: 2px; }
    .btn-approve { background-color: #22c55e; }
    .btn-block { background-color: #f59e0b; color: #000; }
    .btn-cancel { background-color: #ef4444; }
    .btn-erase { background-color: #dc2626; font-weight: bold; }
    .btn-guarantor { background-color: #0284c7; }
    .btn-msg { background-color: #8b5cf6; }
    .btn-paid { background-color: #22c55e; }
    .btn-unpaid-status { background-color: #ef4444; }

    input, select, textarea { padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; width: 100%; box-sizing: border-box; margin-bottom: 8px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
    th, td { border: 1px solid #334155; padding: 8px; text-align: left; }
    th { background-color: #0f172a; color: #94a3b8; }
    
    .badge-pending { background-color: #f59e0b; color: #000; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
    .badge-approved { background-color: #22c55e; color: #fff; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
    .badge-blocked { background-color: #dc2626; color: #fff; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
    .badge-cancelled { background-color: #64748b; color: #fff; padding: 2px 5px; border-radius: 4px; font-weight: bold; }

    .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
    .modal-content { background: #1e293b; margin: 10% auto; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; border: 1px solid #475569; }
    
    #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 999; display: flex; align-items: center; justify-content: center; }
    .login-box { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; width: 90%; max-width: 320px; text-align: center; }
</style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h3 style="color:#38bdf8; margin-top:0;">🔒 የአድሚን መግቢያ</h3>
        <p style="font-size:12px; color:#94a3b8;">እባክዎን የአድሚን ይለፍ ቃል ያስገቡ</p>
        <input type="password" id="admin_password" placeholder="የይለፍ ቃል (Password)" style="text-align:center;">
        <button class="btn" onclick="checkPassword()">ግባ (Login)</button>
    </div>
</div>

<h2>⚙️ KOKETI የአድሚን መቆጣጠሪያ ፓናል</h2>

<div class="card">
    <h3>🛑 የምዝገባ ገደብ እና ሁኔታ መቆጣጠሪያ</h3>
    <div class="grid">
        <div>
            <label>ከፍተኛ የአባላት ገደብ (Max Members)</label>
            <input type="number" id="max_members_limit" placeholder="ለምሳሌ፡ 100">
        </div>
        <div>
            <label>የምዝገባ ሁኔታ (Status)</label>
            <select id="registration_status">
                <option value="OPEN">ክፍት ነው (OPEN)</option>
                <option value="CLOSED">ተዘግቷል (CLOSED)</option>
            </select>
        </div>
    </div>
    <button class="btn btn-toggle-reg" onclick="saveRegistrationSettings()">⚙️ የምዝገባ ገደብ አስተካክል</button>
</div>

<div class="card">
    <h3>🎲 የዕጣ፣ የሳምንትና የማስታወቂያ መቆጣጠሪያ</h3>
    <div class="grid">
        <div>
            <label>ስንተኛው ሳምንት</label>
            <input type="number" id="current_week">
        </div>
        <div>
            <label>የወጣው ዕጣ ቁጥር</label>
            <input type="text" id="draw_number">
        </div>
    </div>
    <div class="grid">
        <div>
            <label>የዕጣው ባለቤት (አሸናፊ)</label>
            <input type="text" id="winner_name">
        </div>
        <div>
            <label>ዕጣ የወጣበት ቀን</label>
            <input type="text" id="draw_date">
        </div>
    </div>
    <button class="btn" onclick="saveDraw(false)">💾 መረጃውን ብቻ መዝግብ</button>
    <button class="btn btn-unpaid" onclick="notifyUnpaidMembers()">⚠️ ላልከፈሉት ብቻ የክፍያ ማሳሰቢያ ላክ</button>
    <button class="btn btn-broadcast" onclick="saveDraw(true)">📢 መዝግብና የከፈሉትን/ያልከፈሉትን ለአባላት በሙሉ አብስር</button>
</div>

<div class="card">
    <h3>👥 የአባላት መረጃ፣ የክፍያ ሁኔታና ዋስትና</h3>
    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>Ref No</th>
                    <th>ስም & ስልክ</th>
                    <th>የሳምንት ክፍያ</th>
                    <th>ደረሰኝ (Screenshot)</th>
                    <th>የዋስትናና የቼክ መረጃ</th>
                    <th>ሁኔታ</th>
                    <th>እርምጃዎች</th>
                </tr>
            </thead>
            <tbody id="membersTable">
                <tr><td colspan="7">መረጃ በመጫን ላይ...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="guarantorModal" class="modal">
    <div class="modal-content">
        <h3 style="color:#38bdf8; margin-top:0;">📝 የቼክ እና የዋስትና መረጃ መዝግብ</h3>
        <input type="hidden" id="modal_member_id">
        <label>የአባሉ ቼክ ቁጥር</label>
        <input type="text" id="modal_member_cheque" placeholder="የቼክ ቁጥር">
        <label>የዋስ ሙሉ ስም</label>
        <input type="text" id="modal_guarantor_name" placeholder="የዋስ ስም">
        <label>የዋስ ቼክ ቁጥር</label>
        <input type="text" id="modal_guarantor_cheque" placeholder="የዋስ ቼክ">
        <label>የተያዘ ንብረት/ካርታ</label>
        <textarea id="modal_collateral_item" rows="2" placeholder="ንብረት ወይም ካርታ"></textarea>
        <button class="btn" onclick="saveGuarantorInfo()">💾 አስቀምጥ</button>
        <button class="btn btn-cancel" onclick="closeModal()" style="margin-top:5px;">ዝጋ</button>
    </div>
</div>

<script>
let currentMembers = [];
const DEFAULT_PASS = "1234";

function checkPassword() {
    const input = document.getElementById('admin_password').value;
    if(input === DEFAULT_PASS) {
        document.getElementById('loginOverlay').style.display = 'none';
        loadData();
    } else {
        alert('የተሳሳተ የይለፍ ቃል ነው!');
    }
}

async function loadData() {
    const res = await fetch('/api/admin/members');
    const data = await res.json();
    currentMembers = data.members;
    
    document.getElementById('draw_number').value = data.settings.latest_draw_number || '';
    document.getElementById('draw_date').value = data.settings.latest_draw_date || '';
    document.getElementById('current_week').value = data.settings.current_week || 1;
    document.getElementById('winner_name').value = data.settings.winner_name || '';

    if(data.settings.max_members) document.getElementById('max_members_limit').value = data.settings.max_members;
    if(data.settings.registration_status) document.getElementById('registration_status').value = data.settings.registration_status;

    const tbody = document.getElementById('membersTable');
    tbody.innerHTML = '';

    data.members.forEach(m => {
        const row = document.createElement('tr');
        const isPaid = m.weekly_paid_status === 1;

        let badgeClass = 'badge-pending';
        if(m.status === 'Approved') badgeClass = 'badge-approved';
        if(m.status === 'Blocked') badgeClass = 'badge-blocked';
        if(m.status === 'Cancelled') badgeClass = 'badge-cancelled';

        const receiptHtml = (m.receipt_path && m.receipt_path !== '-') 
            ? `<a href="/uploads/${m.receipt_path}" target="_blank" style="color:#38bdf8; font-weight:bold;">🖼️ ፎቶ ተመልከት</a>` 
            : 'የለም';

        row.innerHTML = `
            <td><b>${m.ref_no}</b></td>
            <td>${m.first_name} ${m.father_name}<br><small>${m.phone_number}</small><br><b>${m.share_count} ዕጣ</b></td>
            <td>
                <button class="btn-action ${isPaid ? 'btn-paid' : 'btn-unpaid-status'}" onclick="togglePayment(${m.id}, ${isPaid ? 0 : 1})">
                    ${isPaid ? '✅ ከፍሏል' : '❌ አልከፈለም'}
                </button>
            </td>
            <td>${receiptHtml}</td>
            <td>
                <div style="font-size:10px; color:#cbd5e1;">
                    <b>ቼክ:</b> ${m.member_cheque || '-'}<br>
                    <b>ዋስ:</b> ${m.guarantor_name || '-'}<br>
                    <b>የዋስ ቼክ:</b> ${m.guarantor_cheque || '-'}<br>
                    <b>ንብረት:</b> ${m.collateral_item || '-'}
                </div>
                <button class="btn-action btn-guarantor" style="margin-top:4px;" onclick="openGuarantorModal(${m.id})">📝 ዋስትና መዝግብ</button>
            </td>
            <td><span class="${badgeClass}">${m.status}</span></td>
            <td>
                <button class="btn-action btn-approve" onclick="changeStatus(${m.id}, 'Approved')">Approve</button>
                <button class="btn-action btn-block" onclick="changeStatus(${m.id}, 'Blocked')">Block</button>
                <button class="btn-action btn-cancel" onclick="changeStatus(${m.id}, 'Cancelled')">Cancel</button>
                <button class="btn-action btn-erase" onclick="eraseMember(${m.id}, '${m.first_name}')">🗑️ ሰርዝ</button>
                <button class="btn-action btn-msg" onclick="sendDirectMessage('${m.telegram_id}', '${m.first_name}')">📩 መልእክት</button>
            </td>
        `;
        tbody.appendChild(row);
    });
}

async function changeStatus(id, newStatus) {
    if(confirm(`የአባሉን ሁኔታ ወደ ${newStatus} መለወጥ ይፈልጋሉ?`)) {
        await fetch('/api/admin/change_status/' + id, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus })
        });
        loadData();
    }
}

async function eraseMember(id, name) {
    if(confirm(`እርግጠኛ ነዎት አባል [ ${name} ] ሙሉ በሙሉ ከመዝገብ እንዲሰረዝ ይፈልጋሉ?`)) {
        await fetch('/api/admin/delete_member/' + id, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' }
        });
        alert('አባሉ ሙሉ በሙሉ ተሰርዟል!');
        loadData();
    }
}

async function saveRegistrationSettings() {
    const limit = document.getElementById('max_members_limit').value;
    const status = document.getElementById('registration_status').value;

    await fetch('/api/admin/update_registration_settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ max_members: limit, registration_status: status })
    });
    alert('የምዝገባ ገደብ እና ሁኔታ ተስተካክሏል!');
}

function openGuarantorModal(id) {
    const m = currentMembers.find(item => item.id === id);
    if(m) {
        document.getElementById('modal_member_id').value = id;
        document.getElementById('modal_member_cheque').value = m.member_cheque !== '-' ? m.member_cheque : '';
        document.getElementById('modal_guarantor_name').value = m.guarantor_name !== '-' ? m.guarantor_name : '';
        document.getElementById('modal_guarantor_cheque').value = m.guarantor_cheque !== '-' ? m.guarantor_cheque : '';
        document.getElementById('modal_collateral_item').value = m.collateral_item !== '-' ? m.collateral_item : '';
        document.getElementById('guarantorModal').style.display = 'block';
    }
}

function closeModal() {
    document.getElementById('guarantorModal').style.display = 'none';
}

async function saveGuarantorInfo() {
    const id = document.getElementById('modal_member_id').value;
    const data = {
        member_cheque: document.getElementById('modal_member_cheque').value || '-',
        guarantor_name: document.getElementById('modal_guarantor_name').value || '-',
        guarantor_cheque: document.getElementById('modal_guarantor_cheque').value || '-',
        collateral_item: document.getElementById('modal_collateral_item').value || '-'
    };

    await fetch('/api/admin/update_guarantor/' + id, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });

    closeModal();
    loadData();
}

async function togglePayment(id, newStatus) {
    await fetch('/api/admin/toggle_payment/' + id, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ weekly_paid_status: newStatus })
    });
    loadData();
}

async function sendDirectMessage(telegramId, name) {
    if(!telegramId) {
        alert('ይህ አባል የቴሌግራም አይዲ ስለሌለው መልእክት መላክ አይቻልም!');
        return;
    }
    const msg = prompt(`ለ ${name} የሚላከውን መልእክት ያስገቡ፦`);
    if(msg) {
        await fetch('/api/admin/send_direct_msg', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ telegram_id: telegramId, message: msg })
        });
        alert('መልእክቱ ተልኳል!');
    }
}

async function notifyUnpaidMembers() {
    if(confirm('የዚህን ሳምንት ክፍያ ላልፈጸሙ አባላት በሙሉ ማሳሰቢያ እንዲላክ ይፈልጋሉ?')) {
        const res = await fetch('/api/admin/notify_unpaid', { method: 'POST' });
        const data = await res.json();
        alert(`ለ ${data.notified_count} ያልከፈሉ አባላት ማሳሰቢያ ተልኳል!`);
    }
}

async function saveDraw(shouldBroadcast) {
    const num = document.getElementById('draw_number').value;
    const date = document.getElementById('draw_date').value;
    const week = document.getElementById('current_week').value;
    const winner = document.getElementById('winner_name').value;

    if (shouldBroadcast && !confirm('የወጣውን ዕጣ እና የከፈሉ/ያልከፈሉ አባላትን መረጃ ለሁሉም አባላት በቴሌግራም መላክ ይፈልጋሉ?')) {
        return;
    }

    const res = await fetch('/api/admin/update_draw', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            draw_number: num, 
            draw_date: date, 
            current_week: week, 
            winner_name: winner,
            broadcast: shouldBroadcast 
        })
    });

    if (res.ok) {
        alert(shouldBroadcast ? 'ማስታወቂያው ለሁሉም አባላት ተበትኗል!' : 'መረጃው በስኬት ተመዝግቧል!');
        loadData();
    }
}
</script>

</body>
</html>
