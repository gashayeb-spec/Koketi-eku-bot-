<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOKETI KURT & LOUNGE - Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --gold: #f59e0b;
            --gold-hover: #d97706;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f97316;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-light); min-height: 100vh; padding: 15px; }
        .container { max-width: 1300px; margin: 0 auto; }
        
        /* Log In Overlay */
        #loginOverlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-card {
            background: var(--card-bg); border: 1px solid var(--gold); border-radius: 16px;
            padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-card h2 { color: var(--gold); margin-bottom: 20px; font-size: 1.5rem; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem; }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.6); color: var(--text-light); outline: none;
        }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;
            background: var(--gold); color: #0f172a; font-size: 1rem; margin-top: 10px;
        }
        .btn:hover { background: var(--gold-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-secondary { background: #475569; color: white; }

        /* Dashboard Header */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        header h1 { font-size: 1.5rem; color: var(--gold); }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; text-align: center; }
        .stat-card i { font-size: 1.8rem; color: var(--gold); margin-bottom: 8px; }
        .stat-card .value { font-size: 1.4rem; font-weight: bold; margin: 5px 0; }
        .stat-card .label { color: var(--text-muted); font-size: 0.85rem; }

        /* Control Panel Settings */
        .settings-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }

        /* Table */
        .table-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); text-align: center; }
        th { background: rgba(15, 23, 42, 0.8); color: var(--gold); white-space: nowrap; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
        .badge-approved { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-pending { background: rgba(245, 158, 11, 0.2); color: var(--gold); }
        .badge-blocked { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .action-btns { display: flex; gap: 4px; justify-content: center; }
        .action-btns button { padding: 6px 8px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.8rem; }

        .receipt-btn {
            display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px;
            background: rgba(245, 158, 11, 0.15); border: 1px solid var(--gold);
            color: var(--gold); border-radius: 6px; text-decoration: none; font-size: 0.75rem; font-weight: bold;
            transition: 0.3s;
        }
        .receipt-btn:hover { background: var(--gold); color: #0f172a; }

        /* Modals */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:1100; }
        .modal-content { background: #1e293b; border-radius: 12px; padding: 25px; width: 90%; max-width: 500px; border: 1px solid var(--gold); max-height: 90vh; overflow-y: auto; }

        @media(max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            header h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Log In Overlay -->
    <div id="loginOverlay">
        <div class="login-card">
            <i class="fas fa-lock-open-alt" style="font-size: 3rem; color: var(--gold); margin-bottom: 15px;"></i>
            <h2>KOKETI Admin Log In</h2>
            <div class="input-group">
                <label>የአድሚን ይለፍ ቃል (Password)</label>
                <input type="password" id="adminPasswordInput" placeholder="የይለፍ ቃል ያስገቡ">
            </div>
            <button class="btn" onclick="submitLogin()">Log In</button>
            <p id="loginError" style="color: var(--danger); margin-top: 10px; font-size: 0.85rem; display:none;"></p>
        </div>
    </div>

    <div class="container">
        <header>
            <h1><i class="fas fa-user-shield"></i> KOKETI KURT & LOUNGE - Admin</h1>
            <button class="btn btn-danger" style="width: auto; padding: 8px 15px;" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Log Out</button>
        </header>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-users"></i>
                <div class="value" id="statTotalReg">0</div>
                <div class="label">ጠቅላላ የተመዘገቡ</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-user-check"></i>
                <div class="value" id="statTotalApproved">0</div>
                <div class="label">የጸደቁ አባላት</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-user-clock" style="color: var(--warning);"></i>
                <div class="value" id="statTotalPending" style="color: var(--warning);">0</div>
                <div class="label">በመጠባበቅ ላይ (Pending)</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-times-circle" style="color: var(--danger);"></i>
                <div class="value" id="statTotalUnpaid" style="color: var(--danger);">0</div>
                <div class="label">ያልከፈሉ (ያጉላሉ)</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-wallet"></i>
                <div class="value" id="statTotalPaid">0.00 ብር</div>
                <div class="label">ጠቅላላ የተሰበሰበ</div>
            </div>
        </div>

        <!-- Announcement & Broadcast Center -->
        <div class="settings-panel" style="border-color: var(--gold);">
            <h3 style="color: var(--gold); margin-bottom: 15px;"><i class="fas fa-bullhorn"></i> የቴሌግራም ማስታወቂያና ማስጠንቀቂያ መላኪያ</h3>
            <div class="input-group">
                <label>የማስታወቂያ ወይም ማስጠንቀቂያ መልእክት</label>
                <textarea id="announcementText" rows="3" placeholder="ለአባላት የሚተላለፈውን መልእክት እዚህ ይጻፉ..."></textarea>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                <button class="btn btn-success" onclick="sendBroadcast('all')"><i class="fas fa-paper-plane"></i> ለሁሉም አባላት ማስታወቂያ ላክ</button>
                <button class="btn btn-warning" onclick="sendBroadcast('pending')"><i class="fas fa-user-clock"></i> በ'Pending' ላይ ያሉትን አሳስብ</button>
                <button class="btn btn-danger" onclick="sendBroadcast('unpaid')"><i class="fas fa-exclamation-triangle"></i> ላልከፈሉ ማስጠንቀቂያ ላክ</button>
            </div>
        </div>

        <!-- System Controls -->
        <div class="settings-panel">
            <h3 style="color: var(--gold); margin-bottom: 15px;"><i class="fas fa-sliders-h"></i> የዕቁብ መቆጣጠሪያ ፓናል</h3>
            <div class="settings-grid">
                <div class="input-group">
                    <label>የሳምንቱ ዕጣ ቁጥር</label>
                    <input type="text" id="drawNumberInput" placeholder="ምሳሌ፦ 45">
                </div>
                <div class="input-group">
                    <label>የዕጣው ባለቤት ስም</label>
                    <input type="text" id="winnerNameInput" placeholder="የአሸናፊው ስም">
                </div>
                <div class="input-group">
                    <label>የዕጣ ማውጫ ቀን</label>
                    <input type="text" id="drawDateInput" placeholder="YYYY-MM-DD">
                </div>
                <div class="input-group">
                    <label>የአሁኑ ሳምንት</label>
                    <input type="number" id="currentWeekInput" value="1">
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-success" onclick="updateDrawSettings(true)"><i class="fas fa-bullhorn"></i> ዕጣ መዝግብና ለሁሉም አባላት በቴሌግራም አብስር</button>
                <button class="btn btn-secondary" onclick="updateDrawSettings(false)"><i class="fas fa-save"></i> ዕጣ ብቻ መዝግብ</button>
            </div>
            <div style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;" class="settings-grid">
                <div class="input-group">
                    <label>የተፈቀደ ከፍተኛ የአባላት ብዛት</label>
                    <input type="number" id="maxMembersInput" value="100">
                </div>
                <div class="input-group">
                    <label>የምዝገባ ሁኔታ (Registration Status)</label>
                    <select id="regStatusSelect">
                        <option value="OPEN">ክፍት ነው (OPEN)</option>
                        <option value="CLOSED">ተዘግቷል (CLOSED)</option>
                    </select>
                </div>
            </div>
            <button class="btn" style="margin-top: 10px;" onclick="saveRegistrationSettings()">የምዝገባ ገደብ አስተካክል</button>
        </div>

        <!-- Members Table -->
        <h3 style="color: var(--gold); margin-bottom: 15px;"><i class="fas fa-list"></i> የአባላት ሙሉ ዝርዝር</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Ref No</th>
                        <th>ሙሉ ስም</th>
                        <th>ስልክ ቁጥር</th>
                        <th>ዕጣ/ዙር</th>
                        <th>የተከፈለ ብር</th>
                        <th>ደረሰኝ</th>
                        <th>ሁኔታ</th>
                        <th>የሳምንቱ ክፍያ</th>
                        <th>የዋስትና ቼክ</th>
                        <th>እርምጃዎች</th>
                    </tr>
                </thead>
                <tbody id="membersTableBody">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Direct Message Modal -->
    <div id="msgModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--gold); margin-bottom: 15px;">ለአባሉ ቀጥታ መልእክት መላኪያ</h3>
            <input type="hidden" id="msgTelegramId">
            <div class="input-group">
                <label>መልእክት</label>
                <textarea id="directMsgInput" style="height:100px;"></textarea>
            </div>
            <button class="btn" onclick="sendDirectMsg()">መልእክቱን ላክ</button>
            <button class="btn btn-danger" style="margin-top: 8px;" onclick="closeMsgModal()">ዝጋ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if(tg) tg.expand();

        function checkAuth() {
            if (sessionStorage.getItem('adminAuth') === 'true') {
                document.getElementById('loginOverlay').style.display = 'none';
                loadAdminData();
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
            }
        }

        async function submitLogin() {
            const pass = document.getElementById('adminPasswordInput').value;
            const err = document.getElementById('loginError');
            err.style.display = 'none';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: pass})
                });
                const data = await res.json();
                if (res.ok && data.status === 'success') {
                    sessionStorage.setItem('adminAuth', 'true');
                    document.getElementById('loginOverlay').style.display = 'none';
                    loadAdminData();
                } else {
                    err.innerText = data.message || "የተሳሳተ የይለፍ ቃል!";
                    err.style.display = 'block';
                }
            } catch(e) {
                err.innerText = "የሰርቨር ግንኙነት ችግር አጋጥሟል!";
                err.style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('adminAuth');
            window.location.reload();
        }

        async function loadAdminData() {
            try {
                const res = await fetch('/api/admin/members');
                const data = await res.json();
                
                // Set Stats
                document.getElementById('statTotalReg').innerText = data.stats.total_registered;
                document.getElementById('statTotalApproved').innerText = data.stats.total_approved;
                document.getElementById('statTotalPending').innerText = data.stats.total_pending;
                
                // Unpaid count calculation
                let unpaidCount = data.members.filter(m => m.status === 'Approved' && m.weekly_paid_status === 0).length;
                document.getElementById('statTotalUnpaid').innerText = unpaidCount;

                document.getElementById('statTotalPaid').innerText = data.stats.total_paid_sum.toLocaleString() + " ብር";

                // Set Settings
                if(data.settings) {
                    document.getElementById('drawNumberInput').value = data.settings.latest_draw_number || '';
                    document.getElementById('winnerNameInput').value = data.settings.winner_name || '';
                    document.getElementById('drawDateInput').value = data.settings.latest_draw_date || '';
                    document.getElementById('currentWeekInput').value = data.settings.current_week || 1;
                    document.getElementById('maxMembersInput').value = data.settings.max_members || 100;
                    document.getElementById('regStatusSelect').value = data.settings.registration_status || 'OPEN';
                }

                // Populate Table
                const tbody = document.getElementById('membersTableBody');
                tbody.innerHTML = '';
                data.members.forEach(m => {
                    let badgeClass = 'badge-pending';
                    if (m.status === 'Approved') badgeClass = 'badge-approved';
                    if (m.status === 'Blocked' || m.status === 'Cancelled') badgeClass = 'badge-blocked';

                    // Receipt Logic: Shows weekly receipt first if exists, otherwise initial receipt
                    let receiptLink = `<span style="color:var(--text-muted); font-size:0.75rem;">የለም</span>`;
                    if (m.weekly_receipt_url) {
                        receiptLink = `<a href="${m.weekly_receipt_url}" target="_blank" class="receipt-btn"><i class="fas fa-receipt"></i> የሳምንቱ</a>`;
                    } else if (m.receipt_url) {
                        receiptLink = `<a href="${m.receipt_url}" target="_blank" class="receipt-btn"><i class="fas fa-image"></i> የመጀመሪያ</a>`;
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><b>${m.ref_no}</b></td>
                        <td>${m.first_name} ${m.father_name}</td>
                        <td>${m.phone_number}</td>
                        <td>${m.share_count} ዕጣ (${(m.cycle_amount * m.share_count).toLocaleString()} ብር)</td>
                        <td>${m.paid_amount.toLocaleString()} ብር</td>
                        <td>${receiptLink}</td>
                        <td><span class="badge ${badgeClass}">${m.status}</span></td>
                        <td>
                            <button class="btn ${m.weekly_paid_status === 1 ? 'btn-success' : 'btn-danger'}" style="padding: 4px 8px; font-size: 0.75rem;" onclick="togglePayment(${m.id}, ${m.weekly_paid_status === 1 ? 0 : 1})">
                                ${m.weekly_paid_status === 1 ? '✅ ተከፍሏል' : '❌ አልተከፈለም'}
                            </button>
                        </td>
                        <td>
                            <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="openGuarantorModal(${m.id}, '${m.member_cheque}', '${m.guarantor_name}', '${m.guarantor_cheque}', '${m.collateral_item}')">⚙️ ማስተካከያ</button>
                        </td>
                        <td class="action-btns">
                            <button class="btn btn-success" onclick="changeStatus(${m.id}, 'Approved')" title="አጽድቅ"><i class="fas fa-check"></i></button>
                            <button class="btn btn-danger" onclick="changeStatus(${m.id}, 'Blocked')" title="እገድ"><i class="fas fa-ban"></i></button>
                            <button class="btn btn-secondary" onclick="openMsgModal('${m.telegram_id}')" title="መልእክት ላክ"><i class="fas fa-envelope"></i></button>
                            <button class="btn btn-danger" onclick="deleteMember(${m.id})" title="ሰርዝ"><i class="fas fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

            } catch(e) { console.error(e); }
        }

        async function sendBroadcast(targetGroup) {
            const message = document.getElementById('announcementText').value.trim();
            if(!message) {
                alert("እባክዎን መጀመሪያ ማስታወቂያ ወይም ማስጠንቀቂያ መልእክት ይጻፉ!");
                return;
            }

            if(!confirm(`እርግጠኛ ነዎት ይህንን መልእክት ለተመረጡት አባላት (${targetGroup}) መላክ ይፈልጋሉ?`)) return;

            try {
                const res = await fetch('/api/admin/broadcast_message', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ target_group: targetGroup, message: message })
                });
                const data = await res.json();
                if(res.ok) {
                    alert(`መልእክቱ በስኬት ተልኳል! (${data.sent_count} ሰዎች ደርሷቸዋል)`);
                    document.getElementById('announcementText').value = '';
                } else {
                    alert(data.message || "መላክ አልተቻለም");
                }
            } catch(e) { alert("የሰርቨር ግንኙነት ችግር አጋጥሟል!"); }
        }

        async function changeStatus(id, status) {
            if(!confirm("እርግጠኛ ነዎት የዚህን አባል ሁኔታ መቀየር ይፈልጋሉ?")) return;
            await fetch(`/api/admin/change_status/${id}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({status})
            });
            loadAdminData();
        }

        async function deleteMember(id) {
            if(!confirm("እርግጠኛ ነዎት ይህንን አባል ፈጽመው መሰረዝ ይፈልጋሉ?")) return;
            await fetch(`/api/admin/delete_member/${id}`, {method: 'DELETE'});
            loadAdminData();
        }

        async function togglePayment(id, status) {
            await fetch(`/api/admin/toggle_payment/${id}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({weekly_paid_status: status})
            });
            loadAdminData();
        }

        async function updateDrawSettings(broadcast) {
            const draw_number = document.getElementById('drawNumberInput').value;
            const winner_name = document.getElementById('winnerNameInput').value;
            const draw_date = document.getElementById('drawDateInput').value;
            const current_week = document.getElementById('currentWeekInput').value;

            const res = await fetch('/api/admin/update_draw', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({draw_number, winner_name, draw_date, current_week, broadcast})
            });
            if(res.ok) alert("የዕጣ መረጃው በስኬት ተመዝግቧል!");
            loadAdminData();
        }

        async function saveRegistrationSettings() {
            const max_members = document.getElementById('maxMembersInput').value;
            const registration_status = document.getElementById('regStatusSelect').value;

            const res = await fetch('/api/admin/update_registration_settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({max_members, registration_status})
            });
            if(res.ok) alert("የምዝገባ ገደቡ ተስተካክሏል!");
            loadAdminData();
        }

        function openMsgModal(tgId) {
            document.getElementById('msgTelegramId').value = tgId;
            document.getElementById('msgModal').style.display = 'flex';
        }

        function closeMsgModal() { document.getElementById('msgModal').style.display = 'none'; }

        async function sendDirectMsg() {
            const telegram_id = document.getElementById('msgTelegramId').value;
            const message = document.getElementById('directMsgInput').value;

            const res = await fetch('/api/admin/send_direct_msg', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({telegram_id, message})
            });
            if(res.ok) alert("መልእክቱ ተልኳል!");
            closeMsgModal();
        }

        checkAuth();
    </script>
</body>
</html>
